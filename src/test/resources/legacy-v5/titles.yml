# ─────────────────────────────────────────────────────────────
#  LosPerrisStatsAPI · Títulos / Titles
#  Se activa con modules.titles.enabled: true en config.yml.
#  Enable with modules.titles.enabled: true in config.yml.
#
#  Cada título se consigue de UNA forma / Each title is unlocked in ONE way:
#    stat + value      al llegar a ese valor de por vida / reaching that lifetime value
#    season-top: N     acabar una temporada en el top N de cualquier estadística / finishing a season in the top N
#    permission        mientras se tenga el permiso / while holding the permission
#  name: texto o {es: "...", en: "..."} (admite colores &). icon: material del menú (opcional).
#  El jugador elige el suyo: /lpa title <id> o /lpa menu. Variable: %title%
# ─────────────────────────────────────────────────────────────

