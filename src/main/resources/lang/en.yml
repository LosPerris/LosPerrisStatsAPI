# ─────────────────────────────────────────────────────────────
#  LosPerrisStatsAPI · English messages
#  Colors with & (&a, &c, &l...). An empty message ('') is not sent.
#  Valid {variables}: see the guide (link at the top of config.yml) or /lpa help
#  (unknown variables are reported in the console on load).
# ─────────────────────────────────────────────────────────────

general:
  no-permission: "&cYou don't have permission to do that."
  players-only: "&cOnly players can use this command."
  usage: "&cUsage: &f{usage}"
  player-offline: "&cPlayer &f{player} &cwas not found or is offline."

help:
  title: "&8━━━━━ &bLosPerrisStatsAPI &7v{version} &8━━━━━"
  admin-title: "&8━━━━━ &cAdministration &7v{version} &8━━━━━"
  hint: "&8 Hover a command for details; click to type it."
  category: "&6▸ {category}"
  line: "&f  {usage} &8· &7{description}"
  hover: "&e{usage}\n&f{description}\n&7Permission: &e{permission}\n&8Click to type it in chat"
  everyone: "everyone"
  admin-link: "&6▸ Administration &8→ &e/lpa help admin"
  admin-link-hover: "&7See the admin commands you can use\n&8Click to open"
  detail: "&8 Module details: &7/lpa help <module>"
  footer: "&8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  none: "&7 There are no commands available to you."
  none-admin: "&7 You have no admin permissions."
  unknown-topic: "&cThere is no module «{module}». Use &f/lpa modules&c to see the list."
  module-title: "&8━━ &b{description} &8({module}) &8━━"
  module-desc: "&7{description}"
  module-off: "&8 (The module is off: its commands are not available right now.)"
  no-commands: "&7 There are no commands from this module you can use."
  module-file: "&7 Settings: &f{file}"
  # One entry per action: usage (shown), desc (summary), info (on hover)
  cmd:
    top:
      usage: "/lpa top <type>"
      desc: "Top 10 of a statistic"
      info: "Shows the 10 best players in a statistic (kills, deaths, playtime...)."
    menu:
      usage: "/lpa menu"
      desc: "Your stats in a menu"
      info: "Opens a menu with all your statistics."
    sb:
      usage: "/lpa sb"
      desc: "Show or hide the scoreboard"
      info: "Turns the sidebar scoreboard on or off just for you."
    period:
      usage: "/lpa period [weekly|monthly]"
      desc: "Weekly and monthly tops"
      info: "Shows the ranking of the current week or month."
    discord:
      usage: "/lpa discord [status]"
      desc: "Link your Discord account"
      info: "link gives you a code to type on Discord; unlink removes the link."
    lang:
      usage: "/lpa lang [es|en|auto]"
      desc: "Show or change your language"
      info: "auto uses your Minecraft client language."
    version:
      usage: "/lpa version"
      desc: "Plugin version"
      info: "Installed version and authors."
    reset:
      usage: "/lpa reset <player>"
      desc: "Reset statistics"
      info: "Sets all of a player's statistics to zero. Cannot be undone."
    view:
      usage: "/lpa view <player>"
      desc: "View another player's stats"
      info: "Opens another player's stats menu (read only)."
    admin:
      usage: "/lpa admin <player>"
      desc: "Edit statistics"
      info: "Opens a player's statistics editor."
    period-end:
      usage: "/lpa period end <weekly|monthly>"
      desc: "Close a period now"
      info: "Closes the week or month now: announces winners, gives rewards and starts over."
    backup:
      usage: "/lpa backup [now|list]"
      desc: "Backups"
      info: "now creates a backup now; list shows the existing ones."
    modules:
      usage: "/lpa modules [module]"
      desc: "Module status"
      info: "Lists modules by category; with an id shows its details."
    modules-toggle:
      usage: "/lpa modules enable|disable <module>"
      desc: "Enable or disable a module"
      info: "Saves the change in config.yml and applies it right away, no restart."
    reload:
      usage: "/lpa reload"
      desc: "Reload everything"
      info: "Re-reads configuration, languages and modules."
    timings:
      usage: "/lpa timings [reset]"
      desc: "Task timings"
      info: "Average and maximum of each plugin task, to hunt lag."

commands:
  unknown: "&cUnknown command. Use &f/lpa help&c."
  help:
    usage: "/lpa help"
  version:
    usage: "/lpa version"
    version: "&7Version: &b{version}"
    authors: "&7Authors: &f{authors}"
    addon: "&7Addon: &f{module} &7v&b{version}"
  reload:
    usage: "/lpa reload"
    failed: "&cReload aborted: config.yml could not be migrated safely. Check the console; nothing was changed."
    done: "&aConfig and modules reloaded in &f{value} ms&a."
  lang:
    usage: "/lpa lang [es|en|auto]"
    current: "&7Current language: &b{language} &8(available: &f{languages}&8)"
    changed: "&aLanguage changed to &f{language}&a."
    unknown: "&cLanguage not available. Options: &f{languages}&c, auto."
  modules:
    usage: "/lpa modules [module] | enable|disable <module>"
    usage-toggle: "/lpa modules enable|disable <module>"
    header: "&7Modules &8(&a{count} on &8/ &f{total}&8)"
    category: "&6 {category}: "
    separator: "&8, "
    "on": "&a● {module}"
    "off": "&8○ {module}"
    broken: "&e⚠ {module}"
    hover: "&b{module}\n&f{description}\n{value}\n&8Click for details"
    broken-line: "&e ⚠ {module}: &7{reason}"
    hint: "&8 Click a module for details. &a● &8on · &8○ off · &e⚠ &8has problems"
    hint-console: "&8 Details: /lpa modules <module> · ● on · ○ off · ⚠ has problems"
    unknown: "&cUnknown module: &f{module}&c. Use &f/lpa modules&c."
    status:
      "on": "&aOn"
      "off": "&8Off in config.yml"
      broken: "&eEnabled, but not working: &7{reason}"
    detail:
      title: "&8━━ &b{description} &8({module}) &8━━"
      status: "&7 Status: {value}"
      desc: "&7 {description}"
      category: "&7 Category: &f{category}"
      file: "&7 Settings: &f{file}"
      no-file: "&7 Settings: &8no settings of its own"
      commands: "&7 Commands: &f{value}"
      no-commands: "&7 Commands: &8none"
      permissions: "&7 Permissions: &e{permission}"
      requires: "&7 Requires: &f{value}"
      dependencies: "&7 Depends on: &f{modules}"
      guide: "&7 Guide: &f{url}/en/GUIDE.md#{module}"
      enable-button: "&a[Enable]"
      disable-button: "&c[Disable]"
      toggle-hover: "&7Saves the change in config.yml and applies it now\n&8{command}"
      toggle-console: "&7 Toggle: &f{command}"
    toggle:
      enabled: "&aModule &f{module} &aenabled and saved in config.yml."
      disabled: "&cModule &f{module} &cdisabled and saved in config.yml."
      already-on: "&7Module &f{module} &7is already on."
      already-off: "&7Module &f{module} &7is already off."
      needs: "&cCannot enable &f{module}&c: enable &f{modules} &cfirst."
      failed: "&cModule &f{module} &cis enabled in config.yml but did not start: &7{reason}&c. Check the console."
      warning: "&e⚠ {module}: &7{reason}"
      also-disabled: "&7Also turned off (they depend on it): &f{modules}"
      also-enabled: "&7Also turned on: &f{modules}"
      write-failed: "&cCould not save config.yml: &7{reason}&c. Nothing was changed."
    reason:
      needs: "needs module {module}"
      error: "failed to start: {reason}"
      unknown: "did not start (see the console)"
      no-papi: "PlaceholderAPI missing"
      no-token: "no bot token (settings/discord.yml → discord-bot.token)"
      no-webhook: "no valid webhook-url (settings/discord.yml → discord-webhook.webhook-url)"
  timings:
    usage: "/lpa timings [reset]"
    header: "&7Task &8| &7avg &8| &7max &8| &7runs"
    line: "&f {task} &8| &a{avg} ms &8| &e{max} ms &8| &7{runs}"
    line-async: "&f {task} &8(async) | &a{avg} ms &8| &e{max} ms &8| &7{runs}"
    reset: "&aTimings reset."
  top:
    usage: "/lpa top <type>"
  reset:
    usage: "/lpa reset <player>"
  sb:
    usage: "/lpa sb"
  menu:
    usage: "/lpa menu"
  view:
    usage: "/lpa view <player>"
  admin:
    usage: "/lpa admin <player>"
  period:
    usage: "/lpa period [weekly|monthly] | end <weekly|monthly>"
  backup:
    usage: "/lpa backup [now|list]"
  discord:
    usage: "/lpa discord [status]"

