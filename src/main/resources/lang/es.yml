    "off": "&8○ {module}"
    broken: "&e⚠ {module}"
    hover: "&b{module}\n&f{description}\n{value}\n&8Clic para ver el detalle"
    broken-line: "&e ⚠ {module}: &7{reason}"
    hint: "&8 Clic en un módulo para ver su detalle. &a● &8activo · &8○ apagado · &e⚠ &8con problemas"
    hint-console: "&8 Detalle: /lpa modules <módulo> · ● activo · ○ apagado · ⚠ con problemas"
    unknown: "&cMódulo desconocido: &f{module}&c. Use &f/lpa modules&c."
    status:
      "on": "&aActivo"
      "off": "&8Apagado en config.yml"
      broken: "&eActivado, pero no funciona: &7{reason}"
    detail:
      title: "&8━━ &b{description} &8({module}) &8━━"
      status: "&7 Estado: {value}"
      desc: "&7 {description}"
      category: "&7 Categoría: &f{category}"
      file: "&7 Ajustes: &f{file}"
      no-file: "&7 Ajustes: &8no tiene ajustes propios"
      commands: "&7 Comandos: &f{value}"
      no-commands: "&7 Comandos: &8ninguno"
      permissions: "&7 Permisos: &e{permission}"
      requires: "&7 Necesita: &f{value}"
      dependencies: "&7 Depende de: &f{modules}"
      guide: "&7 Guía: &f{url}/es/GUIA.md#{module}"
      enable-button: "&a[Activar]"
      disable-button: "&c[Desactivar]"
      toggle-hover: "&7Guarda el cambio en config.yml y lo aplica ya\n&8{command}"
      toggle-console: "&7 Cambiar: &f{command}"
    toggle:
      enabled: "&aMódulo &f{module} &aactivado y guardado en config.yml."
      disabled: "&cMódulo &f{module} &cdesactivado y guardado en config.yml."
      already-on: "&7El módulo &f{module} &7ya está activo."
      already-off: "&7El módulo &f{module} &7ya está apagado."
      needs: "&cNo se puede activar &f{module}&c: active antes &f{modules}&c."
      failed: "&cEl módulo &f{module} &cquedó activado en config.yml pero no arrancó: &7{reason}&c. Revise la consola."
      warning: "&e⚠ {module}: &7{reason}"
      also-disabled: "&7También se apagaron (dependen de él): &f{modules}"
      also-enabled: "&7También se activaron: &f{modules}"
      write-failed: "&cNo se pudo guardar config.yml: &7{reason}&c. No se cambió nada."
    reason:
      needs: "necesita el módulo {module}"
      error: "error al arrancar: {reason}"
      unknown: "no arrancó (vea la consola)"
      no-papi: "falta PlaceholderAPI"
      no-token: "sin token del bot (settings/discord.yml → discord-bot.token)"
      no-webhook: "sin webhook-url válida (settings/discord.yml → discord-webhook.webhook-url)"
  timings:
    usage: "/lpa timings [reset]"
    header: "&7Tarea &8| &7media &8| &7máx &8| &7ejecuciones"
    line: "&f {task} &8| &a{avg} ms &8| &e{max} ms &8| &7{runs}"
    line-async: "&f {task} &8(async) | &a{avg} ms &8| &e{max} ms &8| &7{runs}"
    reset: "&aTiempos reiniciados."
