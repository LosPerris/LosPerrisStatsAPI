# ─────────────────────────────────────────────────────────────
#  LosPerrisStatsAPI · Mensajes en español
#  Colores con & (&a, &c, &l...). Un mensaje vacío ('') no se envía.
#  Variables válidas entre llaves, p. ej. {player}: vea la guía (enlace al principio de config.yml) o /lpa help
#  (las variables desconocidas se avisan en consola al cargar).
# ─────────────────────────────────────────────────────────────

general:
  no-permission: "&cNo tiene permiso para hacer eso."
  players-only: "&cSolo los jugadores pueden usar este comando."
  usage: "&cUso: &f{usage}"
  player-offline: "&cEl jugador &f{player} &cno se encontró o está desconectado."

help:
  title: "&8━━━━━ &bLosPerrisStatsAPI &7v{version} &8━━━━━"
  admin-title: "&8━━━━━ &cAdministración &7v{version} &8━━━━━"
  hint: "&8 Pase el ratón por un comando para ver más; clic para escribirlo."
  category: "&6▸ {category}"
  line: "&f  {usage} &8· &7{description}"
  hover: "&e{usage}\n&f{description}\n&7Permiso: &e{permission}\n&8Clic para escribirlo en el chat"
  everyone: "todos"
  admin-link: "&6▸ Administración &8→ &e/lpa help admin"
  admin-link-hover: "&7Ver los comandos de administración que puede usar\n&8Clic para abrir"
  detail: "&8 Detalle de un módulo: &7/lpa help <módulo>"
  footer: "&8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  none: "&7 No hay comandos disponibles para usted."
  none-admin: "&7 No tiene permisos de administración."
  unknown-topic: "&cNo existe el módulo «{module}». Use &f/lpa modules&c para ver la lista."
  module-title: "&8━━ &b{description} &8({module}) &8━━"
  module-desc: "&7{description}"
  module-off: "&8 (El módulo está apagado: sus comandos no están disponibles ahora.)"
  no-commands: "&7 No hay comandos de este módulo que pueda usar."
  module-file: "&7 Ajustes: &f{file}"
  # Una entrada por acción: usage (lo que se ve), desc (resumen), info (al pasar el ratón)
  cmd:
    top:
      usage: "/lpa top <tipo>"
      desc: "Top 10 de una estadística"
      info: "Muestra los 10 mejores en una estadística (kills, deaths, playtime...)."
    menu:
      usage: "/lpa menu"
      desc: "Sus estadísticas en un menú"
      info: "Abre un menú con todas sus estadísticas."
    sb:
      usage: "/lpa sb"
      desc: "Mostrar u ocultar el scoreboard"
      info: "Activa o desactiva el scoreboard lateral solo para usted."
    period:
      usage: "/lpa period [weekly|monthly]"
      desc: "Tops semanal y mensual"
      info: "Muestra el ranking de la semana o del mes en curso."
    discord:
      usage: "/lpa discord [status]"
      desc: "Vincular su cuenta de Discord"
      info: "link le da un código para escribir en Discord; unlink deshace el vínculo."
    lang:
      usage: "/lpa lang [es|en|auto]"
      desc: "Ver o cambiar su idioma"
      info: "auto usa el idioma de su cliente de Minecraft."
    version:
      usage: "/lpa version"
      desc: "Versión del plugin"
      info: "Versión instalada y autores."
    reset:
      usage: "/lpa reset <jugador>"
      desc: "Resetear estadísticas"
      info: "Pone a cero todas las estadísticas de un jugador. No se puede deshacer."
    view:
      usage: "/lpa view <jugador>"
      desc: "Ver las estadísticas de otro"
      info: "Abre el menú de estadísticas de otro jugador (solo lectura)."
    admin:
      usage: "/lpa admin <jugador>"
      desc: "Editar estadísticas"
      info: "Abre el editor de estadísticas de un jugador."
    period-end:
      usage: "/lpa period end <weekly|monthly>"
      desc: "Cerrar un periodo ya"
      info: "Cierra la semana o el mes ahora: anuncia ganadores, da premios y empieza de cero."
    backup:
      usage: "/lpa backup [now|list]"
      desc: "Copias de seguridad"
      info: "now crea una copia ahora; list muestra las existentes."
    modules:
      usage: "/lpa modules [módulo]"
      desc: "Estado de los módulos"
      info: "Lista los módulos por categoría; con un id muestra su detalle."
    modules-toggle:
      usage: "/lpa modules enable|disable <módulo>"
      desc: "Activar o desactivar un módulo"
      info: "Guarda el cambio en config.yml y lo aplica al momento, sin reiniciar."
    reload:
      usage: "/lpa reload"
      desc: "Recargar todo"
      info: "Relee la configuración, los idiomas y los módulos."
    timings:
      usage: "/lpa timings [reset]"
      desc: "Tiempos de las tareas"
      info: "Media y máximo de cada tarea del plugin, para buscar lag."

commands:
  unknown: "&cComando desconocido. Use &f/lpa help&c."
