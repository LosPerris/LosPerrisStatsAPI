# LosPerrisStatsAPI · AFK (settings/afk.yml)
# Detecta jugadores AFK; mientras lo estén no ganan hitos ni recompensas.
# Se lee solo si modules.afk: true en config.yml. Aplicar cambios: /lpa reload
